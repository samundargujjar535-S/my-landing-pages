document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hero&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.laneRef = React.createRef();\n    this.stageRef = React.createRef();\n    this.dockRef = React.createRef();\n    this.state = { countdown: \"—\", seats: 41, creatorCount: \"0\", faqOpen: 0, qIndex: 0 };\n    this.pct = 82;\n    this.faqData = [\n      [\"Do I need any technical skills to use Graphy?\", \"No. Graphy is a no-code, AI-powered platform built to be simple, even if you've never built a website or funnel before.\"],\n      [\"Can I really manage my entire coaching business without hiring a team?\", \"Yes. Graphy handles your website, emails, payments, WhatsApp, and cart recovery in one place, and that's exactly what this workshop walks you through.\"],\n      [\"I already use other tools. Will switching to Graphy be complicated?\", \"Not at all. Graphy is built to replace multiple tools with one system. Most coaches launch their entire business on Graphy within a day.\"],\n      [\"Is Graphy only for course creators?\", \"No. Graphy works for coaches, consultants, experts, and anyone selling programs, webinars, or memberships online.\"],\n      [\"What if I've never sold anything online before?\", \"That's exactly who this workshop is for. You'll leave with a simple starting point, not a list of things you still need to figure out.\"]\n    ];\n    this.quoteData = [\n      [\"What I appreciate most about Kumar is his patience and willingness to help. He has been very supportive throughout the process.\", \"Eddy Eustache\", \"Patient, Helpful & Supportive\"],\n      [\"Astitav Kumar was tremendously helpful. He quickly understood exactly where I was stuck and helped me resolve the issue efficiently. I'm very grateful for his support.\", \"Anna Manayan\", \"Quick & Efficient Support\"],\n      [\"Shailja Ji has been my coordinator, and she is extremely humble and professional. She has always been available whenever I needed help and has supported me very well. I'm looking forward to continuing my association with Graphy.\", \"Rinku Rathore\", \"Professional & Always Available\"],\n      [\"I previously used Kajabi for six months but struggled to make progress because the platform felt complicated. After switching to Graphy, I was able to build almost my entire platform within just a few weeks. Graphy is very user-friendly, and their support team has been there whenever I needed help. I especially appreciate having a dedicated advisor who understands what I'm working on. My advisor, Shan, has been absolutely amazing—knowledgeable, responsive, and always willing to get on a call and guide me through any challenges. I cannot recommend Graphy enough.\", \"Lacy Akers\", \"I Cannot Recommend Graphy Enough\"],\n      [\"Thank you so much, Mr. Shan Fernandes, for your wonderful support. I wouldn't have been able to do this without your help. My website now looks much more professional, and I'm extremely grateful. I highly recommend Graphy and working with Shan.\", \"Meredith Shira\", \"My Website Looks So Much More Professional\"],\n      [\"I've had a wonderful experience with Graphy. What truly sets them apart is their customer service. Instead of relying only on chats or emails, they actually get on a call and patiently walk you through everything step by step. You work with a real person who genuinely wants to help. Astitav has been amazing throughout the entire process. I highly recommend Graphy to anyone looking for a platform backed by a team that truly cares about its customers.\", \"S.B\", \"Customer Support That Truly Stands Out\"],\n      [\"As someone new to the online space, I received the right guidance and direction while preparing to launch my first online program. The team was courteous, patient, and helped me understand everything clearly. I especially appreciate their attitude and patience while working with senior citizens. A truly supportive experience.\", \"Venughopaal\", \"An Enabling & Empowering Experience\"],\n      [\"Shan Fernandes did a great job helping me connect my existing website with the new Graphy site he designed for my STEM mentoring and tutoring business. His support has been invaluable, professional, and very timely.\", \"V Williams\", \"The Support Has Been Invaluable\"],\n      [\"Graphy is an excellent product with a thoughtful and user-friendly design. The onboarding experience was extremely smooth. I especially want to appreciate Saavi, who went the extra mile to help me set up my course and website. Highly recommended!\", \"Danish Sheikh\", \"Excellent Product & Smooth Onboarding\"],\n      [\"My experience with Astitav Kumar was amazing. He was patient, caring, and incredibly helpful throughout the entire process. He even gave me more time than scheduled and helped me with every detail. I'm very grateful and feel lucky to have had him as my success representative.\", \"Dima Miqdad\", \"Patient, Caring & Extremely Helpful\"],\n      [\"Shan Fernandes was amazing and very knowledgeable about the platform. He patiently answered all my questions and helped me understand how to use Graphy as my primary course platform.\", \"Dr. Tashanna Gillenwater-Catro\", \"Knowledgeable & Extremely Helpful\"],\n      [\"I was initially nervous because I wasn't very familiar with LMS platforms. Shailaja Nigam first made me feel comfortable and then patiently helped me through the onboarding process. She guided me through the different features and functionalities of the platform. I'm genuinely delighted with the experience.\", \"Subhash Oommen\", \"A Comfortable & Helpful Onboarding Experience\"],\n      [\"Graphy helped me bring my website, courses, payments, and other business systems together on one platform. Astitav went above and beyond to understand my requirements and helped me get my website running exactly the way I needed it within a very short time. I'm extremely appreciative of Astitav and the entire Graphy team. I'm glad I chose Graphy.\", \"Coach Rima Desai\", \"Graphy Is a Wonderful Platform With a Great Team\"],\n      [\"Shan H. Fernandes provided excellent support in helping me reactivate my previous page and resolve my payment issue. When I wasn't able to complete the process online, he stepped in and helped me get everything sorted. Thank you, Mr. Fernandes.\", \"MDelachaussee\", \"Great & Reliable Support\"],\n      [\"Graphy has a great sales and setup team and is an extremely useful platform. Astitav has been incredibly helpful in setting up my domain and showing me how everything works. I'm very happy with my decision to choose Graphy.\", \"Jonah Da California\", \"I'm Loving Graphy!\"],\n      [\"Astitav Kumar made my experience with Graphy extremely smooth and easy. Whenever I faced an issue or needed help understanding a feature, he patiently guided me through it and explained everything clearly. He was professional, supportive, and quick to help whenever needed. I'm very happy with my overall experience.\", \"Aishwarya Jhanji\", \"Great Support & Smooth Experience\"],\n      [\"The AI tools are really helpful, and my website manager has also been extremely supportive. I truly appreciate the efforts of the entire Graphy team.\", \"Chhavi Passan\", \"Helpful AI Tools & Great Support\"],\n      [\"I'm very happy with the overall services offered by Graphy. I especially want to thank Mr. Shashikant for his exceptional support and quick guidance whenever I needed help.\", \"Lucent India\", \"Exceptional Support & Quick Guidance\"],\n      [\"Sasikanth has demonstrated exceptional professionalism and reliability while supporting us on Graphy. He is highly responsive, technically knowledgeable, and consistently provides clear and actionable solutions with minimal turnaround time. His proactive approach and commitment to customer success make him a valuable support partner.\", \"Genius Mind\", \"Professional, Reliable & Highly Responsive\"],\n      [\"I'm extremely satisfied with Graphy and my overall experience with the platform. It is smooth, reliable, and very user-friendly. Akshay was incredibly supportive and patient during the initial setup, and Debosmita has continued providing outstanding support. She is knowledgeable, responsive, and provides quick solutions whenever I face a technical issue. It's rare to find such consistent, high-quality support. I highly recommend Graphy.\", \"A to Z Astro Zon\", \"Outstanding Platform & Support Team\"],\n      [\"Working with Astitav Kumar as my Graphy account manager has been an incredibly positive experience. He took the time to understand my vision and helped me improve not only the technical setup of my courses but also their structure from a business and growth perspective. What stands out most is his proactive approach. He doesn't simply manage tasks—he provides insights, guidance, and practical suggestions that help me move forward confidently. I now feel much more organised, supported, and prepared to launch my programme.\", \"Verna Haywood\", \"More Than Just Technical Support\"],\n      [\"Graphy has been an excellent platform for hosting and selling my courses. It is simple to use, reliable, and offers smooth payment integration. The student experience is clean and professional, and Graphy has helped me manage and grow my online course business without unnecessary technical hassle.\", \"Naveen G P\", \"Simple, Reliable & Built for Course Creators\"],\n      [\"I'm currently moving my website to Graphy because I believe it is a much better fit for my needs. I'm not very technical, but Astitav has been incredibly patient and thorough in helping me understand the entire process. He clearly explains what I can do, how everything works, and has made getting started much easier.\", \"Violet\", \"Patient & Thorough Customer Support\"],\n      [\"Astitav Kumar was extremely helpful, and together we were able to complete everything I needed. He is patient and very knowledgeable about every aspect of the Graphy platform. He is truly a great asset to the company.\", \"Jeffrey\", \"Patient, Knowledgeable & Extremely Helpful\"],\n      [\"Whenever I needed help, I was able to reach out and receive a quick response. I was also given the option to get on a call and receive the exact guidance I needed. The entire experience was friendly, pleasant, supportive, and encouraging.\", \"Britta Cabanos\", \"Fast, Friendly & Personal Support\"],\n      [\"My experience with Astitav was extremely positive. He was supportive, helpful, and patiently taught me how everything worked. His guidance was both clear and efficient. Overall, the service was excellent.\", \"Vikram Sharma\", \"Excellent Service & Patient Guidance\"],\n      [\"I initially had some concerns, but my Customer Success Manager, Astitav, addressed them quickly and effectively. He has proven to be very prepared, competent, and supportive throughout the process. So far, I see great potential in both the platform and the support Graphy provides.\", \"Paul\", \"Great Potential & Strong Customer Support\"],\n      [\"Astitav is a wonderful teacher. He clearly explains the different ways to accomplish things on Graphy while helping us prepare our website for launch. Through his guidance, our recorded sessions, and working with the site builder, I'm becoming much more confident with the platform and feel ready to launch.\", \"Patrick Gandy\", \"A Wonderful Teacher\"],\n      [\"Raj is extremely efficient at what he does. He listens carefully to our problems, understands our requirements, and consistently comes up with effective solutions.\", \"Khushboo\", \"Efficient & Solution-Oriented\"],\n      [\"Graphy is an excellent and very easy-to-use platform for launching online courses.\", \"Coach Ayushi & Coach Vinit J\", \"Easy Platform for Launching Courses\"],\n      [\"My experience with Graphy has been very good. The platform is user-friendly, but what stands out most is the customer support. Whenever I face a problem, Sasikanth is there to help—even during late evenings or busy days. He makes sure my issues are resolved on time. Great service from him and the Graphy team.\", \"Graphy User\", \"Support Even When You Need It Most\"],\n      [\"The way Saavi guided me through the onboarding process was amazing. I had previously purchased another platform where I barely received any onboarding support or responses to my questions. With Graphy, the experience has been completely different. I'm genuinely happy to be with Graphy.\", \"Anupama Sri Devi\", \"Amazing Guidance & Onboarding\"]\n    ];\n  }\n\n    get cards() {\n    const list = [\n      { key: \"rinku\", name: \"Rinku Rathore\", role: \"Spiritual Guide\" },\n      { key: \"radhika\", name: \"Radhika Mohta\", role: \"Matchmaker and Relationship Coach\" },\n      { key: \"preeti\", name: \"Preeti Singh\", role: \"Wealth & Mindset Coach\" }\n    ];\n    const order = [0, 1, 2, 0, 1, 2, 0, 1, 2, 0, 1, 2];\n    const R = (window.__resources || {});\n    const src = (k) => R[\"lc_\" + k] || (\"assets/lifecoach/\" + k + \".jpeg\");\n    return order.map((n, i) => ({ bg: \"url(\" + src(list[n].key) + \")\", name: list[n].name, role: list[n].role, key: i }));\n  }\n\n  get quotes() {\n    const palette = [\"#E1663E\", \"#EF9067\", \"#955710\", \"#C15A45\", \"#2E9E6B\", \"#8A5CD6\", \"#1E88A8\"];\n    return this.quoteData.map(([text, name, role], i) => {\n      const active = this.state.qIndex === i;\n      return {\n        key: i, text, name, role,\n        initial: name.trim().charAt(0).toUpperCase(),\n        avatarColor: palette[i % palette.length],\n        go: () => this.goQuote(i),\n        dotW: active ? \"26px\" : \"8px\",\n        dotBg: active\n          ? \"linear-gradient(90deg, #E1663E, #F0A879)\"\n          : \"linear-gradient(90deg, rgba(42, 30, 24, 0.16), rgba(42, 30, 24, 0.16))\"\n      };\n    });\n  }\n\n  get faqs() {\n    return this.faqData.map(([q, a], i) => {\n      const open = this.state.faqOpen === i;\n      return {\n        key: i, q, a,\n        toggle: () => this.setState((s) => ({ faqOpen: s.faqOpen === i ? -1 : i })),\n        maxHeight: open ? \"300px\" : \"0px\",\n        opacity: open ? \"1\" : \"0\",\n        iconTransform: open ? \"rotate(45deg)\" : \"rotate(0deg)\",\n        iconBg: open ? \"#E1663E\" : \"#F0F1FA\",\n        iconColor: open ? \"#FFFFFF\" : \"#D6572F\"\n      };\n    });\n  }\n\n  /* ---------- shared depth-gallery primitive (hero lane + testimonials + future galleries) ---------- */\n  // depthLayout(nodes, opts) applies one motion language: translate + scale + opacity + blur.\n  // opts: { offsetOf(i), step, scale, rot, fade, blur, lift }\n  depthLayout(nodes, opts) {\n    nodes.forEach((el, i) => {\n      const d = opts.offsetOf(i);\n      const ad = Math.abs(d);\n      const scale = Math.max(0.5, 1 - opts.scale * ad);\n      const x = d * opts.step;\n      const y = (opts.lift || 0) * ad;\n      el.style.transform =\n        \"translate(-50%, -50%) translate3d(\" + x.toFixed(1) + \"px,\" + y.toFixed(1) + \"px,0) rotateY(\" +\n        (-d * (opts.rot || 0)).toFixed(2) + \"deg) scale(\" + scale.toFixed(3) + \")\";\n      el.style.opacity = String(Math.max(0, 1 - opts.fade * ad));\n      el.style.filter = ad > 0 ? \"blur(\" + (opts.blur * ad).toFixed(1) + \"px)\" : \"none\";\n      el.style.zIndex = String(60 - Math.round(ad * 10));\n      el.style.pointerEvents = ad === 0 ? \"auto\" : \"none\";\n      el.style.visibility = ad > (opts.max || 2) + 0.01 ? \"hidden\" : \"visible\";\n    });\n  }\n\n    /* ---------- hero creator arc ---------- */\n  buildGeometry() {\n    const lane = this.laneRef.current;\n    const W = lane.clientWidth, H = lane.clientHeight;\n    const mobile = W < 768;\n    const gap = mobile ? 11 : 18;\n    const grow = mobile ? 0.52 : 0.62;\n    const ratio = 1.5;\n    const half = W / 2;\n    const maxScale = 1 + grow;\n    const lift = mobile ? 30 : 52;\n    const baseW = Math.min(((H - lift) * 0.96) / ratio / maxScale, mobile ? W * 0.3 : W * 0.115);\n    const scaleAt = (x) => maxScale - grow * Math.pow(Math.min(1, Math.abs(x) / half), 1.3);\n    const ds = 0.02, table = [0];\n    let x = 0, s = 0, guard = 0;\n    const limit = half + baseW * maxScale * 0.75;\n    while (x < limit && guard++ < 4000) {\n      x += (baseW * scaleAt(x) + gap) * ds;\n      s += ds;\n      table.push(x);\n    }\n    const n = Math.max(5, Math.ceil(s * 2));\n    return { W, H, mobile, gap, grow, ratio, half, baseW, maxScale, scaleAt, table, ds, n,\n             sMax: n / 2, lift, rot: mobile ? 9 : 11, speed: mobile ? 0.16 : 0.1 };\n  }\n\n  xOf(g, s) {\n    const a = Math.abs(s) / g.ds;\n    const i = Math.min(g.table.length - 2, Math.floor(a));\n    const f = a - i;\n    const v = g.table[i] + (g.table[i + 1] - g.table[i]) * f;\n    return s < 0 ? -v : v;\n  }\n\n  layout() {\n    if (!this.laneRef.current) return;\n    this.g = this.buildGeometry();\n    const cards = this.laneRef.current.querySelectorAll(\"[data-card]\");\n    cards.forEach((el, i) => { el.style.display = i < this.g.n ? \"block\" : \"none\"; });\n    this.frame(performance.now(), true);\n    this.layoutQuotes();\n  }\n\n  frame(now, force) {\n    const lane = this.laneRef.current;\n    if (!lane) return;\n    const g = this.g || (this.g = this.buildGeometry());\n    if (this.t0 === undefined) this.t0 = now;\n    const phase = ((now - this.t0) / 1000) * g.speed;\n    const cards = lane.querySelectorAll(\"[data-card]\");\n    for (let i = 0; i < g.n; i++) {\n      const el = cards[i];\n      if (!el) continue;\n      const s = ((i + phase + g.sMax) % g.n + g.n) % g.n - g.sMax;\n      const x = this.xOf(g, s);\n      const u = Math.max(-1, Math.min(1, x / g.half));\n      const au = Math.abs(u);\n      const w = g.baseW * g.scaleAt(x);\n      const h = w * g.ratio;\n      const y = g.lift * (0.5 - au * au);\n      const fade = 0.72;\n      const o = au > fade ? Math.max(0.4, 1 - (au - fade) / (1 - fade) * 0.6) : 1;\n      el.style.width = w.toFixed(1) + \"px\";\n      el.style.height = h.toFixed(1) + \"px\";\n      el.style.transform = \"translate3d(\" + (x - w / 2).toFixed(2) + \"px,\" + (y - h / 2).toFixed(2) + \"px,0) rotateY(\" + (-u * g.rot).toFixed(2) + \"deg)\";\n      el.style.opacity = o.toFixed(3);\n      el.style.zIndex = String(100 - Math.round(au * 50));\n      el.style.filter = au > 0.55 ? \"saturate(\" + (1 - (au - 0.55) * 0.5).toFixed(2) + \")\" : \"none\";\n    }\n    if (!force) this.raf = requestAnimationFrame((t) => this.frame(t));\n  }\n\n  /* ---------- testimonial gallery ---------- */\n  layoutQuotes() {\n    const stage = this.stageRef.current;\n    if (!stage) return;\n    const nodes = [...stage.querySelectorAll(\"[data-tcard]\")];\n    if (!nodes.length) return;\n    const W = stage.clientWidth;\n    const mobile = W < 768;\n    const cardW = mobile ? Math.min(W * 0.84, 400) : Math.min(W * 0.34, 420);\n    nodes.forEach((el) => {\n      el.style.width = cardW + \"px\";\n      el.style.transition = this.dragging\n        ? \"none\"\n        : \"transform .6s cubic-bezier(.2,.8,.25,1), opacity .5s ease, filter .5s ease\";\n    });\n    const n = nodes.length;\n    const idx = this.state.qIndex;\n    const drag = (this.dragDx || 0) / (cardW * 0.66);\n    this.depthLayout(nodes, {\n      offsetOf: (i) => {\n        let d = i - idx;\n        d = ((d + n + Math.floor(n / 2)) % n) - Math.floor(n / 2);\n        return d - drag;\n      },\n      step: cardW * (mobile ? 0.74 : 0.66),\n      scale: mobile ? 0.14 : 0.12,\n      rot: mobile ? 4 : 7,\n      fade: mobile ? 0.42 : 0.3,\n      blur: mobile ? 2.4 : 3,\n      lift: mobile ? 6 : 10,\n      max: mobile ? 1.2 : 2\n    });\n  }\n\n  goQuote(i) {\n    const n = this.quoteData.length;\n    this.setState({ qIndex: ((i % n) + n) % n });\n  }\n\n  bindDrag() {\n    const stage = this.stageRef.current;\n    if (!stage) return;\n    let startX = 0;\n    const down = (e) => {\n      this.dragging = true;\n      startX = e.clientX;\n      this.dragDx = 0;\n      stage.style.cursor = \"grabbing\";\n      stage.setPointerCapture(e.pointerId);\n    };\n    const move = (e) => {\n      if (!this.dragging) return;\n      this.dragDx = startX - e.clientX;\n      this.layoutQuotes();\n    };\n    const up = () => {\n      if (!this.dragging) return;\n      const dx = this.dragDx || 0;\n      this.dragging = false;\n      this.dragDx = 0;\n      stage.style.cursor = \"grab\";\n      if (Math.abs(dx) > 48) this.goQuote(this.state.qIndex + (dx > 0 ? 1 : -1));\n      else this.layoutQuotes();\n    };\n    stage.addEventListener(\"pointerdown\", down);\n    stage.addEventListener(\"pointermove\", move);\n    stage.addEventListener(\"pointerup\", up);\n    stage.addEventListener(\"pointercancel\", up);\n  }\n\n  /* ---------- count-up numbers + capacity bars (once, on enter) ---------- */\n  animateCount(el) {\n    const to = parseFloat(el.getAttribute(\"data-count\") || \"0\");\n    const dec = parseInt(el.getAttribute(\"data-count-decimals\") || \"0\", 10);\n    const pre = el.getAttribute(\"data-count-prefix\") || \"\";\n    const suf = el.getAttribute(\"data-count-suffix\") || \"\";\n    const commas = el.getAttribute(\"data-count-commas\") === \"1\";\n    const dur = 1500, start = performance.now();\n    const fmt = (v) => {\n      const s = v.toFixed(dec);\n      return commas ? Number(s).toLocaleString(\"en-IN\", { minimumFractionDigits: dec }) : s;\n    };\n    const run = (now) => {\n      const k = Math.min(1, (now - start) / dur);\n      const e = 1 - Math.pow(1 - k, 3);\n      el.textContent = pre + fmt(to * e) + suf;\n      if (k < 1) requestAnimationFrame(run);\n    };\n    requestAnimationFrame(run);\n  }\n\n  fillCapacity(box) {\n    const fill = box.querySelector(\"[data-capacity-fill]\");\n    const label = box.querySelector(\"[data-capacity-pct]\");\n    if (fill) fill.style.width = this.pct + \"%\";\n    if (!label) return;\n    const compact = label.textContent.trim().indexOf(\"%\") === label.textContent.trim().length - 1;\n    const dur = 1600, start = performance.now();\n    const run = (now) => {\n      const k = Math.min(1, (now - start) / dur);\n      const e = 1 - Math.pow(1 - k, 3);\n      const v = Math.round(this.pct * e);\n      label.textContent = compact ? v + \"%\" : v + \"% reserved\";\n      if (k < 1) requestAnimationFrame(run);\n    };\n    requestAnimationFrame(run);\n  }\n\n  observeOnce(selector, cb, ratio) {\n    const nodes = document.querySelectorAll(selector);\n    if (!nodes.length || !(\"IntersectionObserver\" in window)) {\n      nodes.forEach(cb);\n      return;\n    }\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) { cb(e.target); io.unobserve(e.target); }\n      });\n    }, { threshold: ratio });\n    nodes.forEach((el) => io.observe(el));\n    this.observers.push(io);\n  }\n\n  reveal() {\n    const nodes = document.querySelectorAll(\"[data-reveal]\");\n    if (!nodes.length || !(\"IntersectionObserver\" in window)) return;\n    nodes.forEach((el) => {\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(22px)\";\n      el.style.transition = \"opacity .7s ease, transform .7s cubic-bezier(.2,.8,.3,1)\";\n    });\n    document.querySelectorAll(\"[data-line]\").forEach((el) => {\n      el.style.transform = \"scaleX(0)\";\n      el.style.transition = \"transform .9s cubic-bezier(.2,.8,.25,1) .12s\";\n    });\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e, i) => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        el.style.transitionDelay = (i % 6) * 60 + \"ms\";\n        el.style.opacity = \"1\";\n        el.style.transform = \"translateY(0)\";\n        el.querySelectorAll(\"[data-line]\").forEach((l) => { l.style.transform = \"scaleX(1)\"; });\n        io.unobserve(el);\n      });\n    }, { rootMargin: \"0px 0px -12% 0px\", threshold: 0.08 });\n    nodes.forEach((el) => io.observe(el));\n    this.observers.push(io);\n  }\n\n  scroller() {\n    const de = document.scrollingElement || document.documentElement;\n    if (de && de.scrollHeight > de.clientHeight + 4) return de;\n    if (document.body.scrollHeight > document.body.clientHeight + 4) return document.body;\n    return de;\n  }\n\n  bindDock() {\n    const sc = this.scroller();\n    let last = sc.scrollTop, idle = null;\n    this.onScroll = () => {\n      const dock = this.dockRef.current;\n      if (!dock) return;\n      const y = this.scroller().scrollTop;\n      const down = y > last + 4;\n      last = y;\n      if (down) {\n        dock.style.opacity = \"0.82\";\n        dock.style.paddingTop = \"10px\";\n        dock.style.paddingBottom = \"10px\";\n      }\n      clearTimeout(idle);\n      idle = setTimeout(() => {\n        dock.style.opacity = \"1\";\n        dock.style.paddingTop = \"14px\";\n        dock.style.paddingBottom = \"14px\";\n      }, 260);\n    };\n    document.addEventListener(\"scroll\", this.onScroll, { capture: true, passive: true });\n  }\n\n  tick() {\n    const target = new Date(\"2026-08-22T18:00:00+05:30\").getTime();\n    const d = Math.max(0, target - Date.now());\n    const dd = Math.floor(d / 86400000), hh = Math.floor((d % 86400000) / 3600000);\n    const mm = Math.floor((d % 3600000) / 60000), ss = Math.floor((d % 60000) / 1000);\n    const pad = (v) => String(v).padStart(2, \"0\");\n    this.setState({ countdown: (dd > 0 ? dd + \"d \" : \"\") + pad(hh) + \"h \" + pad(mm) + \"m \" + pad(ss) + \"s\" });\n  }\n\n  countUp() {\n    const end = 200000, dur = 1900, start = performance.now();\n    const run = (now) => {\n      const k = Math.min(1, (now - start) / dur);\n      const e = 1 - Math.pow(1 - k, 3);\n      this.setState({ creatorCount: (Math.round((end * e) / 1000) * 1000).toLocaleString(\"en-US\") });\n      if (k < 1) this.countRaf = requestAnimationFrame(run);\n    };\n    this.countRaf = requestAnimationFrame(run);\n  }\n\n  componentDidMount() {\n    this.observers = [];\n    this.layout();\n    this.bindDrag();\n    this.bindDock();\n    this.raf = requestAnimationFrame((t) => this.frame(t));\n    this.onResize = () => this.layout();\n    window.addEventListener(\"resize\", this.onResize);\n    this.tick();\n    this.timer = setInterval(() => this.tick(), 1000);\n    this.countUp();\n    setTimeout(() => {\n      this.reveal();\n      this.observeOnce(\"[data-count]\", (el) => this.animateCount(el), 0.35);\n      this.observeOnce(\"[data-capacity]\", (el) => this.fillCapacity(el), 0.3);\n    }, 60);\n    this.seatTimer = setInterval(() => this.setState((s) => ({ seats: s.seats > 12 ? s.seats - 1 : s.seats })), 47000);\n  }\n\n  componentDidUpdate() {\n    if (!this.laidOut && this.laneRef.current && this.laneRef.current.querySelectorAll(\"[data-card]\").length) {\n      this.laidOut = true;\n      this.layout();\n    }\n    this.layoutQuotes();\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    cancelAnimationFrame(this.countRaf);\n    clearInterval(this.timer);\n    clearInterval(this.seatTimer);\n    (this.observers || []).forEach((o) => o.disconnect());\n    window.removeEventListener(\"resize\", this.onResize);\n    document.removeEventListener(\"scroll\", this.onScroll, { capture: true });\n  }\n\n  renderVals() {\n    return {\n      laneRef: this.laneRef,\n      stageRef: this.stageRef,\n      dockRef: this.dockRef,\n      cards: this.cards,\n      quotes: this.quotes,\n      faqs: this.faqs,\n      prevQuote: () => this.goQuote(this.state.qIndex - 1),\n      nextQuote: () => this.goQuote(this.state.qIndex + 1),\n      countdown: this.state.countdown,\n      seats: this.state.seats,\n      creatorCount: this.state.creatorCount,\n      showProof: this.props.showProof ?? true,\n      showTexture: this.props.showTexture ?? true,\n      ctaShine: this.props.ctaShine ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
